[package]
name = "rewind"
version = "0.1.0"
edition = "2021"
description = "Retroactive, cooperative trace collection: nodes keep traces locally and only talk when something goes wrong."

[[bin]]
name = "rewind-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "rewind-collector"
path = "src/bin/collector.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only between nodes: no TLS stack needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
